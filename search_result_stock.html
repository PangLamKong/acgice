<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - 股票 - AcgIce搜索</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/logicodev.min.css">
    <style>
        .source-badge {
            display: inline-block;
            padding: 2px 8px;
            margin-right: 5px;
            font-size: 11px;
            border-radius: 3px;
            color: #fff;
        }
        .source-Bing { background-color: #008373; }
        .source-Baidu { background-color: #2932e1; }
        .source-DuckDuckGo { background-color: #de5833; }
        .source-Sogou { background-color: #ff6a00; }
        .source-So { background-color: #00aa00; }
        .result-item {
            transition: box-shadow 0.2s;
            display: flex;
            gap: 15px;
        }
        .result-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .result-favicon {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            overflow: hidden;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }
        .result-favicon img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .result-content {
            flex: 1;
            min-width: 0;
        }
        .result-content h4 {
            margin-top: 0;
            margin-bottom: 5px;
        }
        .result-content h4 a {
            text-decoration: none;
        }
        .result-content h4 a:hover {
            text-decoration: underline;
        }
        .site-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .site-name {
            font-weight: 500;
            color: #333;
        }
        .official-badge {
            display: inline-block;
            padding: 1px 6px;
            font-size: 11px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-radius: 3px;
            font-weight: 500;
        }
        .search-stats {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .search-engines {
            font-size: 12px;
            color: #666;
        }
        .result-desc {
            color: #444;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .result-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .count-badge {
            font-size: 12px;
            color: #2196F3;
        }
        .sitelinks {
            margin-top: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 15px;
        }
        .sitelink-item {
            font-size: 12px;
            color: #1a0dab;
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sitelink-item:hover {
            text-decoration: underline;
        }
        .result-thumbnail {
            flex-shrink: 0;
            width: 120px;
            height: 80px;
            border-radius: 6px;
            overflow: hidden;
            background: #f5f5f5;
        }
        .result-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .weather-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            color: #fff;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .weather-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .weather-card .city-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .weather-card .temp-main {
            font-size: 48px;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 10px;
        }
        .weather-card .weather-desc {
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        .weather-card .weather-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 13px;
            opacity: 0.85;
        }
        .weather-card .weather-forecast {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .weather-card .forecast-item {
            flex: 1;
            text-align: center;
            font-size: 12px;
        }
        .weather-card .forecast-day {
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .weather-card .forecast-weather {
            margin-bottom: 3px;
        }
        .weather-card .forecast-temp {
            opacity: 0.9;
        }
        .tool-badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            background: #ff9800;
            color: #fff;
            border-radius: 3px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="header" style="margin-top: 20px;">
                    <div class="logo">
                        <a href="/"><h2>AcgIce 搜索</h2></a>
                    </div>
                    <div class="search-box" style="margin-top: 10px;">
                        <form id="search_form" action="" method="get">
                            <div class="input-group">
                                <input type="text" id="q" name="q" class="form-control" value="股票" placeholder="输入搜索的内容" autocomplete="off">
                                <span class="input-group-btn">
                                    <button type="submit" class="btn btn-primary">搜索</button>
                                </span>
                            </div>
                            <input type="hidden" name="state" value="1">
                            <input type="hidden" name="l" value="web">
                        </form>
                    </div>
                </div>
                <div class="results" style="margin-top: 30px;">
                    <div class="search-stats">
                        <p class="text-muted">
                            为您找到相关结果约 <strong>0</strong> 条
                            <span class="search-engines">
                                | 搜索引擎: 
                                <span class="source-badge source-Bing">Bing</span>
                                <span class="source-badge source-Baidu">百度</span>
                                <span class="source-badge source-DuckDuckGo">DuckDuckGo</span>
                                <span class="source-badge source-Sogou">搜狗</span>
                                <span class="source-badge source-So">360</span>
                            </span>
                        </p>
                    </div>

                                        <div class="weather-card" style="background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);">
                        <div class="tool-badge">📈 股票</div>
                        <div class="city-name">上证指数 (000001)</div>
                        <div style="display: flex; align-items: center; gap: 20px; margin-top: 10px;">
                            <div class="temp-main" style="font-size: 42px;">3285.67</div>
                            <div style="font-size: 24px; color: #4caf50;">
                                +0.82%▲                            </div>
                        </div>
                        <div style="font-size: 12px; opacity: 0.7; margin-top: 10px;">更新时间: 2026-06-30 02:03:17</div>
                    </div>
                            <div class="alert alert-warning">未找到相关结果，请尝试其他关键词</div>
                </div>
<div class="pagination text-center" style="margin-top: 30px;">
        <span class="btn btn-default">第 1 页</span>
    </div>
                <div class="footer text-center" style="margin-top: 50px; padding-bottom: 30px;">
                    <p class="text-muted">AcgIce 搜索 - 多语言聚合搜索引擎</p>
                    <p class="text-muted" style="font-size: 12px;">聚合 Bing、百度、DuckDuckGo、搜狗、360 搜索结果</p>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/jquery-1.11.1.min.js"></script>
    <script src="/static/js/searx.min.js"></script>
</body>
</html>
